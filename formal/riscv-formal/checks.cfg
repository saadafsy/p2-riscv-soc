[options]
isa rv32im

[depth]
insn            20
# DIV/DIVU/REM/REMU spend 34 cycles in EX: at depth 20 none can retire, so
# the check's assumptions would be unsatisfiable (vacuous).
insn_div        45
insn_divu       45
insn_rem        45
insn_remu       45
# reg and pc_fwd at depth 25 did not finish in 3 hours (RV32I run). reg
# passes at 20 in about an hour; pc_fwd at 20 ran over 2 hours without an
# answer and passes at 15 in about 5 minutes.
reg        10   20
pc_fwd     10   15
pc_bwd     10   25
unique     1 10 25
causal     10   25
cover      1    20
ill             20

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
// M instructions use riscv-formal's substitute functions (rtl/core/rv32_muldiv.sv):
// the checks cover decode, operands, stall and writeback of every M op; the
// multiply/divide arithmetic is covered by the ISS lockstep and tb/core.
`define RISCV_FORMAL_ALTOPS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@CORE_FILES@

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
